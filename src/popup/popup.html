<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Reader View</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: system-ui, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 1.5em;
      margin: 0 0 10px 0;
      color: #0d5c63;
    }
    .status {
      background: #e8f5e9;
      padding: 15px;
      border-radius: 5px;
      border-left: 4px solid #4caf50;
    }
    .status p {
      margin: 5px 0;
    }
    .badge {
      display: inline-block;
      background: #4caf50;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.8em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>📧 Email Reader View</h1>
  <div class="status">
    <p><span class="badge">✓ LOADED</span></p>
    <p><strong>Build Status:</strong> In Progress</p>
    <p><strong>Version:</strong> 2.0.0</p>
    <p><strong>Mode:</strong> Development</p>
  </div>
  <p style="margin-top: 15px; font-size: 0.9em; color: #666;">
    Extension is successfully installed. UI build in progress...
  </p>
</body>
</html>
